; PlatformIO Configuration — RP2040-Zero Base Coprocessor (LS-1)
;
; Environments:
;   [env:rp2040_zero] — Bare-metal firmware build via Pico C/C++ SDK (Zero Jitter)
;   [env:native]      — Host-side unit tests (runs on dev machine)

[env:rp2040_zero]
platform      = raspberrypi
board         = waveshare_rp2040_zero
framework     = picosdk
monitor_speed = 921600
build_flags   =
    -DTARGET_RP2040
    -O3
    -Wall
    -Wextra

[env:native]
platform       = native
build_flags    =
    -std=c++17
    -DUNIT_TEST
test_build_src = true
test_framework = unity

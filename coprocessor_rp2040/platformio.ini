; PlatformIO Configuration — RP2040-Zero Base Coprocessor
;
; Two environments:
;   [env:rp2040_zero] — Target firmware build (flashed to board)
;   [env:native]      — Host-side unit tests (runs on dev machine)

[env:rp2040_zero]
platform  = raspberrypi
board     = waveshare_rp2040_zero
framework = arduino
monitor_speed = 921600
build_flags =
    -DTARGET_RP2040
    -O2

[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
test_framework = unity

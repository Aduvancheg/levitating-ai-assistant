; PlatformIO Configuration — ESP32-CAM Sphere Agent
;
; Two environments:
;   [env:esp32cam]  — Target firmware build (flashed to board)
;   [env:native]    — Host-side unit tests (runs on dev machine)

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
build_flags =
    -DESP32
    -O2

[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
test_framework = unity
